[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "voicesss"
version = "0.1.0"
description = "Detector de voz com transcricao em portugues e normalizacao feminina para auto-referencias."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Voicesss" }
]
dependencies = [
  "numpy>=1.24",
  "rich>=13.7",
  "typer>=0.12"
]

[project.optional-dependencies]
stt = [
  "faster-whisper>=1.0"
]
mic = [
  "sounddevice>=0.4.6",
  "webrtcvad-wheels>=2.0.11.post1"
]
all = [
  "faster-whisper>=1.0",
  "sounddevice>=0.4.6",
  "webrtcvad-wheels>=2.0.11.post1"
]
dev = [
  "pytest>=8.0"
]

[project.scripts]
voicesss = "voicesss.cli:app"
voicesss-app = "voicesss.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voicesss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
